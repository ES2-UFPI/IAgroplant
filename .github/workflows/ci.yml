name: Continuous Integration

on:
  push:
    branches: [ dev, main, master, 'feature/**' ]
  pull_request:
    branches: [ dev, main, master, 'feature/**' ]

jobs:
  backend-tests:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: IAgroplant-project/IAgroplant-back

      - name: Run Pytest
        run: pytest
        working-directory: IAgroplant-project/IAgroplant-back

  frontend-check:
    name: Frontend Typecheck (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: IAgroplant-project/IAgroplant-Mobile/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: IAgroplant-project/IAgroplant-Mobile

      - name: Run TypeScript Verification
        run: npx tsc --noEmit
        working-directory: IAgroplant-project/IAgroplant-Mobile
